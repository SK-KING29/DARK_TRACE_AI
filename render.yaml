services:
  - type: web
    name: darktrace-ai
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: darktrace-ai-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      # "*" is safe here ONLY because this service also serves the frontend
      # (backend/app/main.py mounts frontend/ at "/" — same-origin, so CORS
      # doesn't restrict anything a browser would otherwise block). If you
      # split the deployment (frontend on Netlify, backend here), replace
      # this with your frontend's exact origin, e.g.
      # "https://your-app.netlify.app" — see .env.example / README.md.
      - key: CORS_ORIGINS
        value: "*"
      - key: PORT
        value: 8000

databases:
  - name: darktrace-ai-db
    plan: free
    databaseName: darktrace_ai
    user: darktrace

version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: darktrace
      POSTGRES_PASSWORD: darktrace_dev_password
      POSTGRES_DB: darktrace_ai
    volumes:
      - darktrace_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U darktrace -d darktrace_ai"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://darktrace:darktrace_dev_password@db:5432/darktrace_ai
      ENVIRONMENT: development
      SECRET_KEY: dev-only-change-me
      CORS_ORIGINS: "*"
      PORT: 8000
    ports:
      - "8000:8000"

volumes:
  darktrace_pgdata:
